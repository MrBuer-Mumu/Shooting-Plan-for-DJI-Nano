name: Shooting Plan for DJI Nano

on:
  workflow_dispatch:
  schedule:
    # 北京时间每日凌晨5点执行 (UTC-8，对应cron UTC 21:00)
    - cron: '0 21 * * *'

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 配置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行拍摄方案脚本
        env:
          CAIYUN_TOKEN: ${{ secrets.CAIYUN_TOKEN }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python generate_plan.py
